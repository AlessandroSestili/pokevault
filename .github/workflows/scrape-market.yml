name: Weekly Market Scrape

on:
  schedule:
    - cron: "0 3 * * 1" # ogni lunedì alle 03:00 UTC
  workflow_dispatch: # run manuale dal pannello GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: npx tsx scripts/scrape-market.ts
